/*
 * The Android half: one Activity wrapping the offline web app in a WebView.
 *
 * The web app is already a set of static files with no server and no network
 * calls, so unlike a site that talks to an API there is nothing to reach for —
 * the whole thing ships inside the APK and runs from there.
 */
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = 'Einbuergerungstest'
include ':app'
