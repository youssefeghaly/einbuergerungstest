<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einbürgerungstest – Übung</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #1b1f24;
    --muted: #5c6672;
    --line: #dfe3e8;
    --accent: #1b4f9c;
    --accent-soft: #e8effa;
    --ok: #1a7f45;
    --ok-soft: #e6f4ec;
    --bad: #b3261e;
    --bad-soft: #fdecea;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 6px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 11px 16px;
    transition: background .12s, border-color .12s;
  }
  button:hover:not(:disabled) { border-color: #b9c2cc; }
  button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; }
  button:disabled { cursor: default; }
  .primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .primary:hover:not(:disabled) { background: #16417f; border-color: #16417f; }
  /* „Weiter“ bleibt gesperrt, bis eine Antwort gewählt ist. */
  .primary:disabled {
    background: #dfe4ea;
    border-color: #dfe4ea;
    color: #9aa4b0;
  }
  /* Die Fehler-Übung: rot, damit sie nicht mit „Test starten“ verwechselt wird. */
  .danger {
    background: var(--bad);
    border-color: var(--bad);
    color: #fff;
    font-weight: 600;
  }
  .danger:hover:not(:disabled) { background: #8e1d17; border-color: #8e1d17; }
  .danger:disabled {
    background: #f3d9d6;
    border-color: #e7c3bf;
    color: #8a6b67;
  }
  .grow { flex: 1 1 45%; }
  /* „Beenden“ im Test: klein, aber rot, damit es nicht übersehen wird. */
  .stop {
    padding: 6px 12px;
    font-size: .85rem;
    border-radius: 8px;
    background: var(--bad);
    border: 1px solid var(--bad);
    color: #fff;
    font-weight: 600;
  }
  .stop:hover:not(:disabled) { background: #8e1d17; border-color: #8e1d17; }
  /* Kennzeichnet die Fehler-Übung, solange die Fragenbezeichnung fehlt. */
  .mode-badge {
    background: var(--bad-soft);
    color: var(--bad);
    border: 1px solid #f0c9c5;
    border-radius: 99px;
    padding: 2px 10px;
    font-size: .72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  select {
    font: inherit;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    min-width: 240px;
  }
  label { font-weight: 600; display: block; margin-bottom: 6px; }

  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 18px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .18s; }

  .qmeta { font-size: .82rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .repeat-hint {
    background: #fff6e5;
    border: 1px solid #f0d9a8;
    color: #7a5a12;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: .88rem;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .qtext { font-size: 1.18rem; font-weight: 600; line-height: 1.4; margin-bottom: 16px; }
  .qimg { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; margin: 4px 0 16px; display: block; }

  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    text-align: left;
    width: 100%;
    padding: 13px 15px;
    line-height: 1.4;
  }
  .opt .key {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-size: .82rem; font-weight: 700; color: var(--muted);
  }
  .opt.state-ok { background: var(--ok-soft); border-color: var(--ok); }
  .opt.state-ok .key { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.state-bad { background: var(--bad-soft); border-color: var(--bad); }
  .opt.state-bad .key { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt[disabled] { opacity: 1; }

  .verdict { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
  .verdict.ok { background: var(--ok-soft); color: var(--ok); }
  .verdict.bad { background: var(--bad-soft); color: var(--bad); }
  .verdict span { display: block; font-weight: 400; color: var(--ink); margin-top: 4px; }

  .score { font-size: 2.6rem; font-weight: 700; line-height: 1; margin: 4px 0 10px; }
  .score.ok { color: var(--ok); }
  .score.bad { color: var(--bad); }

  .review { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #fff; }
  .review .tag { font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; display: inline-block; margin-bottom: 8px; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.open { background: #eef0f3; color: var(--muted); }
  .review .q { font-weight: 600; margin-bottom: 8px; }
  .review .ans { font-size: .92rem; margin: 2px 0; }
  .review .ans b { font-weight: 600; }
  .review img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); margin: 6px 0; }
  .fnote { font-size: .85rem; color: var(--muted); margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  @media (max-width: 480px) {
    .card { padding: 16px; }
    .qtext { font-size: 1.08rem; }
    select { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>
<main id="app"></main>

<!-- Datensatz: identisch zu data/questions.json, als Script ladbar,
     damit die Seite auch per Doppelklick (file://) ohne Webserver funktioniert. -->
<script src="data/questions.js"></script>
<script>
(function () {
  "use strict";

  var STATE_NAMES = {
    BW: "Baden-Württemberg", BY: "Bayern", BE: "Berlin", BB: "Brandenburg",
    HB: "Bremen", HH: "Hamburg", HE: "Hessen", MV: "Mecklenburg-Vorpommern",
    NI: "Niedersachsen", NW: "Nordrhein-Westfalen", RP: "Rheinland-Pfalz",
    SL: "Saarland", SN: "Sachsen", ST: "Sachsen-Anhalt",
    SH: "Schleswig-Holstein", TH: "Thüringen"
  };
  var GENERAL_COUNT = 30;
  var STATE_COUNT = 3;
  var TOTAL = GENERAL_COUNT + STATE_COUNT;

  var DATA = window.QUESTION_DATA;
  var app = document.getElementById("app");

  var view = {
    phase: "start",     // start | quiz | result
    mode: "normal",     // normal | wrong
    stateCode: "HE",
    test: [],
    answers: [],
    index: 0
  };

  // Ob für den laufenden Test ein Eintrag in der Verlaufsliste steht.
  var historyArmed = false;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function shuffle(items) {
    var a = items.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildTest(stateCode) {
    var all = DATA.questions;
    var general = all.filter(function (q) { return q.part === "general"; });
    var regional = all.filter(function (q) { return q.part === "state" && q.state === stateCode; });
    var usedStems = {};
    var picked = pickWeighted(general, GENERAL_COUNT, usedStems)
      .concat(pickWeighted(regional, STATE_COUNT, usedStems));
    return shuffle(picked);
  }

  // ---------- Lernstand ----------
  // Je Frage: s = wie oft gesehen, t = zuletzt gesehen (ms), bad = liegt im
  // Fehlerstapel, streak = richtige Antworten in Folge seit dem letzten Fehler.
  // Eine Frage verlässt den Fehlerstapel nach ZWEI richtigen Antworten in Folge.
  var STORE_KEY = "eit.progress.v1";
  var CLEAR_AFTER = 2; // richtige Antworten in Folge, bis eine Frage als gelernt gilt

  var store = {
    available: true,
    data: {},
    load: function () {
      try {
        var raw = window.localStorage.getItem(STORE_KEY);
        this.data = raw ? JSON.parse(raw) : {};
        if (!this.data || typeof this.data !== "object") this.data = {};
      } catch (e) {
        this.available = false;
        this.data = {};
      }
      this.migrate();
    },
    // Der alte Stand kannte nur s/w/c. Daraus lässt sich der Fehlerstapel
    // ableiten: falsch beantwortet und seither nicht zweimal richtig.
    migrate: function () {
      var changed = false;
      for (var id in this.data) {
        if (!Object.prototype.hasOwnProperty.call(this.data, id)) continue;
        var st = this.data[id];
        if (st.bad === undefined) {
          var wrong = st.w || 0;
          var correctInARow = st.c || 0;
          st.bad = wrong > 0 && correctInARow < CLEAR_AFTER;
          st.streak = st.bad ? Math.min(correctInARow, CLEAR_AFTER - 1) : 0;
          st.t = st.t || 0; // unbekannt: gilt als am längsten nicht gesehen
          changed = true;
        }
      }
      if (changed) this.save();
    },
    save: function () {
      try {
        window.localStorage.setItem(STORE_KEY, JSON.stringify(this.data));
      } catch (e) {
        this.available = false;
      }
    },
    get: function (id) {
      var st = this.data[id];
      if (!st) return { s: 0, t: 0, bad: false, streak: 0 };
      return {
        s: st.s || 0,
        t: st.t || 0,
        bad: !!st.bad,
        streak: st.streak || 0
      };
    },
    record: function (id, correct) {
      var st = this.get(id);
      st.s += 1;
      st.t = Date.now();
      if (!correct) {
        st.bad = true;
        st.streak = 0;
      } else if (st.bad) {
        st.streak += 1;
        if (st.streak >= CLEAR_AFTER) {
          st.bad = false;
          st.streak = 0;
        }
      }
      this.data[id] = st;
      this.save();
    },
    reset: function () {
      this.data = {};
      try {
        window.localStorage.removeItem(STORE_KEY);
      } catch (e) {
        /* nichts zu tun */
      }
    }
  };

  // Mehrere amtliche Fragen haben denselben Wortlaut, aber andere
  // Antwortmöglichkeiten (z. B. "Welches Land ist ein Nachbarland von
  // Deutschland?" kommt fünfmal vor). Für den Test zählen sie als derselbe
  // Fragetext, damit er nicht zweimal dieselbe Frage stellt.
  function stemKey(text) {
    return text.toLowerCase().replace(/[^a-z0-9äöüß]+/g, " ").trim();
  }

  // Der Fragenvorrat: alle allgemeinen Fragen und die des gewählten Landes.
  function poolFor(stateCode) {
    return DATA.questions.filter(function (q) {
      return q.part === "general" || q.state === stateCode;
    });
  }

  // Reihenfolge, aus der gezogen wird: nie gesehene zuerst (zufällig), danach
  // die am längsten nicht gesehenen. So wandert der Test durch den Katalog und
  // beginnt erst von vorn, wenn alles einmal dran war.
  function ordered(pool) {
    var items = pool.map(function (q) {
      var st = store.get(q.id);
      return { q: q, unseen: st.s === 0, t: st.t, r: Math.random() };
    });
    items.sort(function (a, b) {
      if (a.unseen !== b.unseen) return a.unseen ? -1 : 1;
      if (a.unseen) return a.r - b.r;
      if (a.t !== b.t) return a.t - b.t;
      return a.r - b.r;
    });
    return items.map(function (item) { return item.q; });
  }

  // Nimmt count Fragen aus ordered(), überspringt aber bereits verwendete
  // Fragetexte, damit kein Wortlaut zweimal im selben Test steht.
  function take(items, count, usedStems) {
    var out = [], i;
    for (i = 0; i < items.length && out.length < count; i++) {
      var key = stemKey(items[i].question);
      if (usedStems[key]) continue;
      usedStems[key] = true;
      out.push(items[i]);
    }
    return out;
  }

  function buildTest(stateCode) {
    var pool = poolFor(stateCode);
    var general = ordered(pool.filter(function (q) { return q.part === "general"; }));
    var regional = ordered(pool.filter(function (q) { return q.part === "state"; }));
    var usedStems = {};

    // Solange überhaupt noch etwas ungesehen ist, werden Landesfragen nicht
    // wiederholt: es kommen dann eben weniger als drei, im Extremfall keine.
    var somethingNew = pool.some(function (q) { return store.get(q.id).s === 0; });
    var stateCount = STATE_COUNT;
    if (somethingNew) {
      stateCount = Math.min(STATE_COUNT, pool.filter(function (q) {
        return q.part === "state" && store.get(q.id).s === 0;
      }).length);
    }

    var picked = take(regional, stateCount, usedStems);
    picked = picked.concat(take(general, TOTAL - picked.length, usedStems));
    // Reicht der allgemeine Vorrat nicht, füllt der Rest des Landesvorrats auf.
    if (picked.length < TOTAL) {
      picked = picked.concat(take(regional, TOTAL - picked.length, usedStems));
    }
    return shuffle(picked.slice(0, TOTAL));
  }

  // Nur die Fragen, die zuletzt falsch beantwortet wurden.
  function wrongPool(stateCode) {
    return poolFor(stateCode).filter(function (q) { return store.get(q.id).bad; });
  }

  function buildWrongTest(stateCode) {
    var bad = wrongPool(stateCode);
    var badState = shuffle(bad.filter(function (q) { return q.part === "state"; }));
    var badGeneral = shuffle(bad.filter(function (q) { return q.part === "general"; }));
    var usedStems = {};

    // 30 + 3 wie im echten Test, wenn der Stapel es hergibt.
    var picked = take(badState, STATE_COUNT, usedStems);
    picked = picked.concat(take(badGeneral, TOTAL - picked.length, usedStems));
    if (picked.length < TOTAL) {
      picked = picked.concat(take(badState, TOTAL - picked.length, usedStems));
    }
    if (picked.length < TOTAL) {
      picked = picked.concat(take(badGeneral, TOTAL - picked.length, usedStems));
    }
    return shuffle(picked.slice(0, TOTAL));
  }

  // Ein Test lässt sich jederzeit abbrechen; bereits gegebene Antworten bleiben
  // im Lernstand, der Rest des Durchlaufs wird verworfen.
  function goHome() {
    view.phase = "start";
    view.mode = "normal";
    view.test = [];
    view.answers = [];
    view.index = 0;
    render();
  }

  // Startet einen Durchlauf im gewünschten Modus.
  function beginTest(mode) {
    view.mode = mode;
    view.test = mode === "wrong" ? buildWrongTest(view.stateCode) : buildTest(view.stateCode);
    view.answers = view.test.map(function () { return null; });
    view.index = 0;
    view.phase = "quiz";
    // Ein Eintrag in der Verlaufsliste, damit die Zurück-Taste des Telefons zur
    // Startseite führt statt die App zu schliessen.
    if (!historyArmed) {
      try {
        window.history.pushState({ eitTest: true }, "");
        historyArmed = true;
      } catch (e) {
        /* Verlauf nicht verfügbar: dann bleibt die Zurück-Taste aussen vor */
      }
    }
    render();
  }

  function progressStats(stateCode) {
    var pool = poolFor(stateCode);
    var seen = 0, bad = 0, clean = 0;
    pool.forEach(function (q) {
      var st = store.get(q.id);
      if (st.s > 0) seen++;
      if (st.bad) bad++;
      else if (st.s > 0) clean++;
    });
    return { seen: seen, bad: bad, clean: clean, total: pool.length };
  }

  function score() {
    var n = 0;
    for (var i = 0; i < view.test.length; i++) {
      if (view.answers[i] === view.test[i].correct) n++;
    }
    return n;
  }

  function label(q) {
    return q.part === "general"
      ? "Allgemeine Frage " + q.number
      : STATE_NAMES[q.state] + " · Frage " + q.number;
  }

  // ---------- views ----------

  function startView() {
    var options = Object.keys(STATE_NAMES).map(function (code) {
      return '<option value="' + code + '"' + (code === view.stateCode ? " selected" : "") + ">" +
        esc(STATE_NAMES[code]) + "</option>";
    }).join("");

    var stats = progressStats(view.stateCode);
    var wrongReady = stats.bad > TOTAL;
    var storageNote = store.available
      ? ""
      : '<p class="muted" style="margin:12px 0 0;font-size:.88rem">Hinweis: Dieser Browser ' +
        "erlaubt kein Speichern. Der Lernstand geht dann beim Schliessen der Seite verloren.</p>";

    var wrongHint = wrongReady
      ? "Übt nur die Fragen, die du zuletzt falsch hattest."
      : "Verfügbar, sobald mehr als " + TOTAL + " falsche Fragen zusammen sind (aktuell " +
        stats.bad + ").";

    return '<div class="card">' +
      "<h1>Einbürgerungstest – Übung</h1>" +
      '<p class="muted">Übungstest mit 33 Fragen: ' + GENERAL_COUNT + " allgemeine Fragen und " +
      STATE_COUNT + " Fragen zu deinem Bundesland.</p>" +
      '<p class="muted">Nach jeder Antwort siehst du sofort, ob sie richtig war. Es läuft keine Uhr – ' +
      "du kannst in Ruhe üben und am Ende alles noch einmal durchgehen.</p>" +
      '<p class="muted"><strong>Jede Frage einmal:</strong> „Test starten“ nimmt zuerst Fragen, die du ' +
      "noch nie hattest, und arbeitet sich so durch den ganzen Katalog. Erst wenn alles einmal dran " +
      "war, kommen die am längsten nicht gesehenen wieder.</p>" +
      "</div>" +
      '<div class="card">' +
      "<h2>Dein Lernstand</h2>" +
      "<p>" + stats.seen + " von " + stats.total + " Fragen gesehen" +
      (stats.clean > 0 ? ", " + stats.clean + " davon ohne offene Fehler" : "") + ".</p>" +
      "<p>" + (stats.bad === 0
        ? "Keine falsche Antwort gespeichert."
        : "<strong>" + stats.bad + "</strong> " + (stats.bad === 1 ? "Frage liegt" : "Fragen liegen") +
          " im Fehlerstapel.") + " " + wrongHint + "</p>" +
      (stats.seen > 0
        ? '<div class="row"><button data-act="reset">Lernstand zurücksetzen</button></div>'
        : "") +
      storageNote +
      "</div>" +
      '<div class="card">' +
      "<label for=\"state\">Bundesland</label>" +
      '<div class="row"><select id="state">' + options + "</select></div>" +
      '<div class="row" style="margin-top:12px">' +
      '<button class="primary grow" data-act="start">Test starten</button>' +
      '<button class="danger grow" data-act="start-wrong"' + (wrongReady ? "" : " disabled") + ">" +
      "Fehler üben" + (stats.bad > 0 ? " (" + stats.bad + ")" : "") + "</button>" +
      "</div>" +
      '<p class="muted" style="margin:12px 0 0;font-size:.88rem">' +
      "Der Test wird bei jedem Start neu zusammengestellt. Im echten Test gelten 17 von 33 richtigen " +
      "Antworten als bestanden – hier ist das nur eine Information.</p>" +
      "</div>";
  }

  function quizView() {
    var q = view.test[view.index];
    var chosen = view.answers[view.index];
    var answered = chosen !== null;

    var opts = q.options.map(function (text, i) {
      var cls = "opt";
      if (answered) {
        if (i === q.correct) cls += " state-ok";
        else if (i === chosen) cls += " state-bad";
      }
      return '<button class="' + cls + '" data-act="answer" data-i="' + i + '"' +
        (answered ? " disabled" : "") + ">" +
        '<span class="key">' + "ABCD"[i] + "</span><span>" + esc(text) + "</span></button>";
    }).join("");

    var verdict = "";
    if (answered) {
      var right = chosen === q.correct;
      verdict = '<div class="verdict ' + (right ? "ok" : "bad") + '">' +
        (right ? "Richtig." : "Leider falsch.") +
        "<span>Richtige Antwort: " + esc(q.options[q.correct]) + "</span></div>";
    }

    var last = view.index === view.test.length - 1;
    // „Weiter“ bleibt gesperrt, bis eine Antwort gewählt ist – überspringen
    // ist nicht mehr möglich.
    var nextLabel = last ? "Auswertung anzeigen" : "Weiter";

    // War diese Frage schon einmal falsch? Dann sagt es die Seite vorher.
    var before = store.get(q.id);
    var hint = (!answered && before.bad)
      ? '<p class="repeat-hint">Diese Frage hattest du zuvor falsch beantwortet.</p>'
      : "";

    return "<div>" +
      '<div class="row" style="justify-content:space-between;align-items:center">' +
      '<div class="qmeta" style="margin:0">Frage ' + (view.index + 1) + " von " +
        view.test.length + "</div>" +
      '<div class="row" style="align-items:center;gap:10px">' +
      (view.mode === "wrong" ? '<span class="mode-badge">Fehler-Übung</span>' : "") +
      '<button class="stop" data-act="home" title="Test beenden und zur Startseite">Beenden</button>' +
      "</div>" +
      "</div>" +
      '<div class="bar"><i style="width:' +
        Math.round(((view.index + (answered ? 1 : 0)) / view.test.length) * 100) + '%"></i></div>' +
      '<div class="card">' +
      hint +
      '<div class="qtext">' + esc(q.question) + "</div>" +
      (q.image ? '<img class="qimg" src="' + esc(q.image) + '" alt="Abbildung zur Frage">' : "") +
      '<div class="opts">' + opts + "</div>" +
      verdict +
      "</div>" +
      '<div class="row" style="justify-content:space-between">' +
      '<button data-act="back"' + (view.index === 0 ? " disabled" : "") + ">Zurück</button>" +
      '<button class="primary" data-act="next"' + (answered ? "" : " disabled") + ">" +
      nextLabel + "</button>" +
      "</div>" +
      "</div>";
  }

  function resultView() {
    var n = score();
    var pct = Math.round((n / view.test.length) * 100);
    var passed = n >= 17;

    var review = view.test.map(function (q, i) {
      var chosen = view.answers[i];
      var state = chosen === null ? "open" : (chosen === q.correct ? "ok" : "bad");
      var tag = state === "open" ? "nicht beantwortet" : (state === "ok" ? "richtig" : "falsch");
      var lines = '<div class="ans"><b>Richtige Antwort:</b> ' + esc(q.options[q.correct]) + "</div>";
      if (chosen !== null && chosen !== q.correct) {
        lines = '<div class="ans"><b>Deine Antwort:</b> ' + esc(q.options[chosen]) + "</div>" + lines;
      }
      return '<div class="review">' +
        '<span class="tag ' + state + '">' + tag + "</span>" +
        '<div class="qmeta">' + esc(label(q)) + "</div>" +
        '<div class="q">' + esc(q.question) + "</div>" +
        (q.image ? '<img src="' + esc(q.image) + '" alt="Abbildung zur Frage">' : "") +
        lines +
        "</div>";
    }).join("");

    var stats = progressStats(view.stateCode);
    var wrongThisRound = view.test.filter(function (q, i) {
      return view.answers[i] !== null && view.answers[i] !== q.correct;
    }).length;
    var wrongReady = stats.bad > TOTAL;

    return "<div>" +
      '<div class="card">' +
      "<h1>Auswertung</h1>" +
      '<div class="score ' + (passed ? "ok" : "bad") + '">' + n + " von " + view.test.length + "</div>" +
      "<p>" + pct + " % richtig. " + (passed
        ? "Das würde im echten Test zum Bestehen reichen (mindestens 17 richtige Antworten)."
        : "Im echten Test brauchst du mindestens 17 richtige Antworten.") + "</p>" +
      "<p>" + (wrongThisRound > 0
        ? wrongThisRound + (wrongThisRound === 1 ? " Frage ist" : " Fragen sind") +
          " jetzt im Fehlerstapel und kommt" + (wrongThisRound === 1 ? "" : "en") +
          " in der Fehler-Übung wieder."
        : "Keine falsche Antwort in diesem Durchlauf.") + "</p>" +
      '<p class="muted">Lernstand: ' + stats.seen + " von " + stats.total + " Fragen gesehen, " +
      stats.bad + " im Fehlerstapel.</p>" +
      '<div class="row"><button class="primary" data-act="again">Neuer Test</button>' +
      '<button class="danger" data-act="again-wrong"' + (wrongReady ? "" : " disabled") + ">" +
      "Fehler üben (" + stats.bad + ")</button>" +
      '<button data-act="home">Bundesland ändern</button></div>' +
      "</div>" +
      "<h2>Alle Fragen im Überblick</h2>" +
      review +
      '<p class="fnote">Fragen und Bilder stammen aus dem amtlichen Gesamtfragenkatalog des BAMF ' +
      "(Stand " + esc(DATA.catalog_version) + "). Die Antwortschlüssel stammen aus einem externen, " +
      "MIT-lizenzierten Datensatz; Einzelheiten stehen in der Verifikationsdatei des Projekts.</p>" +
      "</div>";
  }

  function render() {
    if (!DATA || !DATA.questions) {
      app.innerHTML = '<div class="card"><h1>Fragen konnten nicht geladen werden</h1>' +
        "<p>Die Datei <code>data/questions.js</code> fehlt oder ist beschädigt. " +
        "Bitte <code>tools/build_dataset.py</code> erneut ausführen.</p></div>";
      return;
    }
    app.innerHTML = view.phase === "start" ? startView()
      : view.phase === "quiz" ? quizView()
      : resultView();
    window.scrollTo(0, 0);
  }

  // ---------- interaction ----------

  app.addEventListener("click", function (event) {
    var target = event.target.closest("[data-act]");
    if (!target || target.disabled) return;
    var act = target.getAttribute("data-act");

    if (act === "start" || act === "start-wrong") {
      var sel = document.getElementById("state");
      if (sel) view.stateCode = sel.value;
      beginTest(act === "start-wrong" ? "wrong" : "normal");
    } else if (act === "again" || act === "again-wrong") {
      beginTest(act === "again-wrong" ? "wrong" : view.mode);
    } else if (act === "answer") {
      var i = parseInt(target.getAttribute("data-i"), 10);
      if (view.answers[view.index] === null) {
        view.answers[view.index] = i;
        store.record(view.test[view.index].id, i === view.test[view.index].correct);
        render();
      }
    } else if (act === "next") {
      if (view.answers[view.index] === null) return; // erst antworten
      if (view.index === view.test.length - 1) view.phase = "result";
      else view.index++;
      render();
    } else if (act === "back") {
      if (view.index > 0) { view.index--; render(); }
    } else if (act === "reset") {
      if (window.confirm("Lernstand wirklich zurücksetzen? Alle gemerkten Antworten gehen verloren.")) {
        store.reset();
        render();
      }
    } else if (act === "again") {
      beginTest(view.mode);
    } else if (act === "home") {
      goHome();
    }
  });

  // Zurück-Taste (Telefon oder Browser): aus dem Test zur Startseite, statt die
  // App zu schliessen.
  window.addEventListener("popstate", function () {
    historyArmed = false;
    if (view.phase !== "start") goHome();
  });

  document.addEventListener("keydown", function (event) {
    if (view.phase !== "quiz") return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    var k = event.key;
    if (k >= "1" && k <= "4") {
      var i = parseInt(k, 10) - 1;
      if (view.answers[view.index] === null) {
        view.answers[view.index] = i;
        store.record(view.test[view.index].id, i === view.test[view.index].correct);
        render();
      }
    } else if (k === "Enter" || k === "ArrowRight") {
      if (view.answers[view.index] === null) return; // erst antworten
      if (view.index === view.test.length - 1) view.phase = "result"; else view.index++;
      render();
    } else if (k === "ArrowLeft") {
      if (view.index > 0) { view.index--; render(); }
    }
  });

  store.load();
  render();

  // Testzugang: erlaubt tools/test_app.js, die Auswahl direkt zu prüfen.
  window.__EIT__ = {
    buildTest: buildTest,
    buildWrongTest: buildWrongTest,
    wrongPool: wrongPool,
    poolFor: poolFor,
    stemKey: stemKey,
    store: store,
    progressStats: progressStats,
    beginTest: beginTest,
    render: render,
    view: view
  };
})();
</script>
</body>
</html>
